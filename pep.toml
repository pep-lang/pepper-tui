[package]
name = "tui"
version = "1.4.0"
description = "Full-screen terminal apps in the style of Ratatui: widgets, layout and diffed rendering over pepper-term"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper-tui"
# The oldest Pepper toolchain that builds the package (pepper-unicode
# needs 0.12): CI also tests with it, and `pepper package` skips a version
# whose minimum is newer than the user's toolchain.
minimum_toolchain = "0.12.0"

[dependencies]
term = { github = "pep-lang/pepper-term", version = "1.4.0" }
unicode = { github = "pep-lang/pepper-unicode", version = "1.1.0" }
