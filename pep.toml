[package]
name = "tui"
version = "1.3.0"
description = "Full-screen terminal apps in the style of Ratatui: widgets, layout and diffed rendering over pepper-term"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper-tui"
# The oldest Pepper toolchain that builds the package (0.11 added the
# panic hook): CI also tests with it, and `pepper package` skips a version
# whose minimum is newer than the user's toolchain.
minimum_toolchain = "0.11.0"

[dependencies]
term = { github = "pep-lang/pepper-term", version = "1.4.0" }
